name: Scout outage maps
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Open each map and record its data sources
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          npm i puppeteer-core@22 >/dev/null 2>&1
          cat > s.js <<'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const pages = [
            'https://www.outageentry.com/Outage/outage.php?Client=walton',
            'https://outage.rayleemc.com/'
          ];
          (async () => {
            const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            const out = [];
            for (const url of pages) {
              const rec = { page: url, finalUrl: null, links: [], requests: [] };
              const p = await browser.newPage();
              await p.setViewport({ width: 1280, height: 900 });
              p.on('response', async r => {
                const req = r.request();
                const t = req.resourceType();
                if (['image', 'font', 'stylesheet', 'media'].includes(t)) return;
                const item = { url: r.url(), type: t, status: r.status(), ct: r.headers()['content-type'] || '', method: req.method(), post: (req.postData() || '').slice(0, 3000) };
                if (['xhr', 'fetch', 'document', 'script', 'other'].includes(t) && !/\.js(\?|$)/.test(r.url())) {
                  try { item.body = (await r.text()).slice(0, 8000); } catch (e) {}
                }
                rec.requests.push(item);
              });
              try {
                await p.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
                await new Promise(res => setTimeout(res, 20000));
                rec.finalUrl = p.url();
                rec.links = await p.$$eval('a, iframe', els => els.map(e => (e.href || e.src || '') + ' | ' + (e.textContent || '').trim().slice(0, 60)).filter(s => /outage|map|storm/i.test(s)));
              } catch (e) { rec.error = String(e); }
              out.push(rec);
              await p.close();
            }
            await browser.close();
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/scout-results2.json', JSON.stringify(out, null, 1));
          })();
          EOF
          node s.js
      - name: Save results
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add scout-results2.json
          git commit -m "scout results" || exit 0
          git pull --rebase
          git push
