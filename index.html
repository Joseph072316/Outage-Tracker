<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outage Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #111418; --panel: #1a1f25; --line: #2a313a; --text: #e8eaed; --muted: #8b95a1;
    --hot: #ff4d3d; --warm: #ff9a2e; --old: #d4a72c; --cleared: #6b7480;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  header .checked { color: var(--muted); font-size: 13px; }
  #map { height: 42vh; min-height: 260px; background: #0d1014; }
  .totals { display: flex; gap: 18px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .totals b { font-size: 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 14px 10px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  main { padding: 0 0 30px; }
  .county h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
               margin: 0; padding: 14px 14px 6px; border-top: 1px solid var(--line); }
  .county h2 span { float: right; text-transform: none; letter-spacing: 0; }
  .item { display: flex; gap: 10px; padding: 9px 14px; border-top: 1px solid #20262d; }
  .item .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
  .item .body { flex: 1; min-width: 0; }
  .item .top { display: flex; justify-content: space-between; gap: 8px; }
  .item .where { font-weight: 600; }
  .item .num { font-weight: 700; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 13px; }
  .item.cleared { opacity: .5; }
  .item.cleared .where, .item.cleared .num { font-weight: 400; }
  .empty { padding: 30px 14px; color: var(--muted); text-align: center; }
  .sources { padding: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .sources div { margin: 2px 0; }
  .ok { color: #5fd38d; } .bad { color: var(--hot); } .off { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Outage Tracker</h1>
  <span class="checked" id="checked">loading…</span>
</header>
<div id="map"></div>
<div class="totals" id="totals"></div>
<div class="legend">
  <span><i style="background:var(--hot)"></i>under 1 hr</span>
  <span><i style="background:var(--warm)"></i>1–3 hrs</span>
  <span><i style="background:var(--old)"></i>3+ hrs</span>
  <span><i style="background:var(--cleared)"></i>cleared (last 24 hrs)</span>
</div>
<main id="list"></main>
<div class="sources" id="sources"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COUNTY_ORDER = ["Clarke", "Oconee", "Jackson", "Madison", "Oglethorpe", "Greene", "Walton"];
const REFRESH_MS = 2 * 60 * 1000;

const map = L.map("map", { zoomControl: false, attributionControl: true });
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 18, subdomains: "abcd",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; CARTO'
}).addTo(map);
map.fitBounds([[33.45, -83.9], [34.3, -82.9]]);
const layer = L.layerGroup().addTo(map);
let firstLoad = true;

function ageColor(o, now) {
  if (o.cleared) return "var(--cleared)";
  const hrs = (now - o.start) / 3600000;
  return hrs < 1 ? "var(--hot)" : hrs < 3 ? "var(--warm)" : "var(--old)";
}
function cssVar(v) { return v.startsWith("var(") ? getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim() : v; }

function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " hr" + (r ? " " + r + " min" : "");
}
function clock(ms) {
  const d = new Date(ms), today = new Date();
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === today.toDateString() ? t : d.toLocaleDateString([], { weekday: "short" }) + " " + t;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function place(o) { return o.location || (o.lat != null ? o.lat.toFixed(4) + ", " + o.lon.toFixed(4) : "Location unknown"); }

function render(data) {
  const now = Date.now();
  const outages = data.outages || [];
  const active = outages.filter(o => !o.cleared);
  const cleared = outages.filter(o => o.cleared);

  document.getElementById("checked").textContent = data.checked ? "checked " + clock(data.checked) : "";
  document.getElementById("totals").innerHTML =
    `<div><b>${active.length}</b> active</div>` +
    `<div><b>${active.reduce((s, o) => s + (o.customers || 0), 0).toLocaleString()}</b> customers out</div>` +
    `<div><b>${cleared.length}</b> cleared</div>`;

  // Map: cleared first so active dots sit on top.
  layer.clearLayers();
  [...cleared, ...active].forEach(o => {
    if (o.lat == null) return;
    const color = cssVar(ageColor(o, now));
    const r = o.cleared ? 5 : Math.min(16, 6 + Math.sqrt(o.customers || 1));
    const m = L.circleMarker([o.lat, o.lon], {
      radius: r, color, fillColor: color, weight: o.cleared ? 1 : 2,
      opacity: o.cleared ? 0.6 : 1, fillOpacity: o.cleared ? 0.25 : 0.75
    });
    m.bindPopup(`<b>${esc(place(o))}</b><br>${esc(o.utility)} · ${o.customers} out<br>` +
      (o.cleared ? `Down ${clock(o.start)} – back ${clock(o.cleared)}` : `Down ${dur(now - o.start)} (since ${clock(o.start)})`));
    layer.addLayer(m);
  });

  // List grouped by county.
  const groups = {};
  outages.forEach(o => (groups[o.county || "Unknown"] ??= []).push(o));
  const counties = Object.keys(groups).sort((a, b) => {
    const ia = COUNTY_ORDER.indexOf(a), ib = COUNTY_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const list = document.getElementById("list");
  if (!outages.length) {
    list.innerHTML = `<div class="empty">No outages in your counties in the last 24 hours.</div>`;
  } else {
    list.innerHTML = counties.map(c => {
      const items = groups[c].sort((a, b) => (!!a.cleared - !!b.cleared) || (b.start - a.start));
      const out = items.filter(o => !o.cleared).reduce((s, o) => s + (o.customers || 0), 0);
      return `<section class="county"><h2>${esc(c)}<span>${out ? out.toLocaleString() + " out" : "all clear"}</span></h2>` +
        items.map(o => `
          <div class="item${o.cleared ? " cleared" : ""}">
            <span class="dot" style="background:${ageColor(o, now)}"></span>
            <div class="body">
              <div class="top"><span class="where">${esc(place(o))}</span><span class="num">${(o.customers || 0).toLocaleString()} out</span></div>
              <div class="sub">${esc(o.utility)} · ${o.cleared
                ? `down ${clock(o.start)}, back ${clock(o.cleared)} (${dur(o.cleared - o.start)})`
                : `down ${dur(now - o.start)}, since ${clock(o.start)}`}${o.cause ? " · " + esc(o.cause) : ""}</div>
            </div>
          </div>`).join("") + `</section>`;
    }).join("");
  }

  const s = data.sources || {};
  document.getElementById("sources").innerHTML = "<b>Sources</b>" + Object.values(s).map(x => {
    const cls = x.state === "ok" ? "ok" : x.state === "error" ? "bad" : "off";
    const label = x.state === "ok" ? "working" : x.state === "error" ? "error" : "not connected yet";
    return `<div><span class="${cls}">●</span> ${esc(x.name)}: ${label}${x.state === "error" ? " — " + esc(x.message) : ""}</div>`;
  }).join("");

  if (firstLoad && active.some(o => o.lat != null)) {
    map.fitBounds(L.featureGroup(layer.getLayers()).getBounds().pad(0.3), { maxZoom: 12 });
  }
  firstLoad = false;
}

async function load() {
  try {
    const r = await fetch("data/outages.json?t=" + Date.now(), { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    document.getElementById("checked").textContent = "couldn't load data";
  }
}
load();
setInterval(load, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
